#add custom theme snippets here
decoration { 
        rounding = 8
        active_opacity = 1
        inactive_opacity = 1
    shadow {
        enabled = true
        color = $color3
        #color = $background
        range = 15
        #range = 30
        color_inactive = $color0
        render_power = 50
      }
     blur {
        size = 10
        #size = 20
        passes = 4
        noise = 0.06
        vibrancy = 1
        }
}
general { 
    border_size = 1
    col.active_border = $color3
    col.inactive_border = $color0
    gaps_in = 2
#    gaps_in = 5
    gaps_out = 4
#    gaps_out = 8
}

 animations {
    bezier=cubicsome,0.72,0.46,0.74,0.77
    bezier=suuu,0.93,-0.09,0.18,0.77
    bezier=neomm,0.0,0.52,0.3,0.49
    animation=windows,1,2,cubicsome
    animation=windowsIn,1,1.5,neomm,popin 40%
    animation=layers,1,2,cubicsome
    animation=windowsOut,1,2,cubicsome
    animation=border,0
    animation=borderangle,0
    animation=workspaces,1,2.5,neomm,slidefadevert 10%
    animation=specialWorkspace,1,6,default,slidevert
#      animation = fade, 1, 4.5, default
#      animation = workspaces, 1, 4, cubicsome, fade
 }

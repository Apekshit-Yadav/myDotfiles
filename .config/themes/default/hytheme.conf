#add custom theme snippets here
decoration { 
        rounding = 12
        active_opacity = 1
        inactive_opacity = 1
    shadow {
        color = $background
        range = 30
        offset = 2 2
        color_inactive = $color0
        render_power = 50
      }
     blur {
        size = 5
        passes = 5
        noise = 0
        vibrancy = 1
        }
}
general { 
    border_size = 2
    col.active_border = $foreground
    col.inactive_border = $background
   # gaps_in = 12
   # gaps_out = 12
}

animations {
     animation = windowsIn, 1,1, default, slide
     animation = windowsOut, 1, 4, default, gnomed
     animation = border, 0, 1, default
     animation = borderangle, 0, 1, default
     animation = fade, 1, 2, default
     animation = workspaces, 1, 4, default, slidefadevert 30%
     animation = specialWorkspace, 1, 6, default, fade
}

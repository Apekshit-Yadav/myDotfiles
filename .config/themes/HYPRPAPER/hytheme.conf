#add custom theme snippets here
decoration { 
        rounding = 16
        active_opacity = 1
        inactive_opacity = 1
    shadow {
        color = $background
        range = 50
        offset = 2 2
        color_inactive = $color0
        render_power = 5
      }
     blur {
        size = 7
        passes = 2
        noise = 0
        vibrancy = 1
        }
}
general { 
    border_size = 2
    #col.active_border = $foreground
    col.active_border = $color3
    col.inactive_border = $background
   # gaps_in = 12
   # gaps_out = 12
}
animations { 
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  bezier = cubicsome, .72,  .46,  .74,  .77
  bezier = cubicsome2,.44,.08,.39,.8
  bezier = cubic-bezier,.44,.08,.39,.8
  bezier = flippin,.8,.8,.46,.98
  bezier = toing, .57 ,-0.51 ,.8 ,1.68
  animation = workspaces, 1, 4.5, myBezier, slidefade
  animation = windows, 1, 7, myBezier
  animation = windowsOut, 1, 7, default, popin 80%
}

#add custom theme snippets here
decoration { 
        rounding = 16
        active_opacity = 1
        inactive_opacity = 1
    shadow {
        color = $background
        range = 50
        offset = 2 2
        color_inactive = $color0
        render_power = 5
      }
     blur {
        size = 7
        passes = 2
        noise = 0
        }
}
general { 
    border_size = 2
    #col.active_border = $foreground
    col.active_border = $color3
    col.inactive_border = $background
    gaps_in = 6
    gaps_out = 18
}
animations { 
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  bezier = cubicsome, 0.72, 0.46,  0.74,  0.77
  bezier = cubicsome2, 0.44, 0.08, 0.39, 0.8
  bezier = cubic-bezier, 0.44, 0.08, 0.39, 0.8
  bezier = flippin, 0.8, 0.8, 0.46, 0.98
  bezier = toing, 0.57 ,-0.51 ,0.8 ,1.68
  animation = workspaces, 1, 4.5, myBezier, slidefade
  animation = windows, 1, 7, myBezier
  animation = windowsOut, 1, 7, default, popin 80%
}

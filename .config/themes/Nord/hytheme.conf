#add custom theme snippets here
decoration { 
        rounding = 24
        active_opacity = 1
        inactive_opacity = 1
    shadow {
        color = $color3
        range = 20
        color_inactive = $color0
        render_power = 12
      }
     blur {
        size = 10
        passes = 5
        noise = 0
        vibrancy = 2
        }
}
general { 
    border_size = 6
    col.active_border = $color10
    #col.active_border = $foreground
    col.inactive_border = $background
    }

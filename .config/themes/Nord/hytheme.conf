#add custom theme snippets here
decoration { 
        rounding = 20
        #rounding = 8
        active_opacity = 1
        inactive_opacity = 1
    shadow {
        enabled = true
        color = $background
        range = 20
        color_inactive = $color0
        render_power = 15
      }
     blur {
        size = 20
        passes = 4
        noise = 0.05
 #       vibrancy = 1
        }
}
general { 
    border_size = 2
    col.active_border = $color12
    col.inactive_border = $background
    gaps_in = 4
#    gaps_in = 5
    gaps_out = 8
}

